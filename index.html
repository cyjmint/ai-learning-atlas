<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier AI Atlas — AI 원리의 인과관계 지도</title>
    <meta
      name="description"
      content="AI 기술의 출발점부터 현대 프론티어 AI의 작동 방식까지 인과관계 중심의 단일 경로로 체계적으로 학습하는 인터랙티브 웹 가이드"
    />
    <meta name="theme-color" content="#C2593E" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('frontier-ai-atlas:v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          // Ignore storage access errors during initial paint
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
